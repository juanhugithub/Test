name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore GaoGaoWorkSpace.sln

      - name: Build
        run: dotnet build GaoGaoWorkSpace.sln -c Release --no-restore

      - name: Test
        run: dotnet test src/GaoGaoWorkSpace.Tests/GaoGaoWorkSpace.Tests.csproj -c Release --no-build

      - name: Publish framework-dependent
        run: dotnet publish src/GaoGaoWorkSpace.App/GaoGaoWorkSpace.App.csproj -c Release -r win-x64 --self-contained false -o publish/framework

      - name: Publish self-contained
        run: dotnet publish src/GaoGaoWorkSpace.App/GaoGaoWorkSpace.App.csproj -c Release -r win-x64 --self-contained true -o publish/self

      - name: Zip artifacts (PowerShell)
        shell: pwsh
        run: |
          Compress-Archive -Path publish/framework/* -DestinationPath GaoGaoWorkSpace-win-x64-framework.zip
          Compress-Archive -Path publish/self/* -DestinationPath GaoGaoWorkSpace-win-x64-self-contained.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GaoGaoWorkSpace-win-x64-framework.zip
            GaoGaoWorkSpace-win-x64-self-contained.zip
          generate_release_notes: true
